name: Bioconductor CI

on:
  push:
    branches: [ devel, main, master, RELEASE_* ]
  pull_request:
    branches: [ devel, main, master, RELEASE_* ]

jobs:
  bioccheck:
    # Only contents: read is needed. pkgdown is off, so the pages/id-token
    # permissions the reusable workflow documents for deployment don't apply.
    permissions:
      contents: read
    uses: bioconductor/workflows/.github/workflows/bioccheck.yml@main
    with:
      error_on: 'warning'
      enable_pkgdown: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
